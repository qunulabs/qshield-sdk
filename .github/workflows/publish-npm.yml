# Publishes @qnulabs/qshield-sdk to npm from the public mirror.
#
# THIS FILE IS GENERATED. It is written from sdk/mirror/ in qunulabs/qshield by
# that repository's .github/workflows/release-sdk.yml. Edit it there. A change made
# in this repository is removed by the next release.
#
# WHY THE PUBLISH LIVES IN A PUBLIC REPOSITORY AND NOT IN THE MONOREPO: npm
# authenticates this publish with trusted publishing over GitHub OIDC, a
# short-lived job-scoped credential rather than a stored npm token. npm accepts
# that exchange only from GitHub-hosted runners, and the monorepo has none
# available. Public repositories get GitHub-hosted runners for free. Being public
# also lets npm generate PROVENANCE, which it has refused for packages built from
# private source repositories since July 2023.
#
# GITHUB-HOSTED RUNNERS ONLY. Never point this workflow at a self-hosted runner.
# It would break the OIDC exchange, and attaching a self-hosted runner to a public
# repository lets any fork's pull request execute arbitrary code on it.
#
# THE FILENAME IS PINNED ON THE NPM SIDE. `publish-npm.yml` is part of the OIDC
# subject npm matches against the trusted-publisher configuration for
# @qnulabs/qshield-sdk. Renaming this file, or adding an `environment:` key to the
# job, changes that subject and npm refuses the publish until the setting on
# npmjs.com is changed to match.
#
# NPM PUBLISHES ARE PERMANENT. The gate that decides whether this version is fit
# to publish already ran in the monorepo, against the whole platform, before the
# tag arrived here. The checks below re-run the SDK's own suite so provenance
# attests a build that was verified in the repository it claims to come from.

name: publish-npm

on:
  push:
    tags:
      - "v*"
  # Retry a publish for a tag that is already here, without re-releasing from the
  # monorepo. This is the supported recovery path when the mirror received the tag
  # but npm rejected the publish.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: read
  id-token: write # the npm OIDC exchange

concurrency:
  group: publish-npm-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # The monorepo only ever pushes plain release tags here, so anything else is
      # a mistake rather than a normal event. Fail rather than skip: unlike the
      # monorepo side, there is no legitimate prerelease traffic to stay quiet
      # about.
      - name: Check the tag against the manifest
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RAW_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::${RAW_TAG} is not a plain release tag. The mirror publishes vMAJOR.MINOR.PATCH only."
            exit 1
          fi
          tag_version="${BASH_REMATCH[1]}"
          manifest_version="$(node -p 'require("./package.json").version')"
          # The version is written into the manifest by the monorepo when it stages
          # this snapshot. If the two disagree, the snapshot and the tag came from
          # different releases and neither can be trusted.
          if [ "${tag_version}" != "${manifest_version}" ]; then
            echo "::error::tag ${RAW_TAG} does not match the manifest version ${manifest_version}"
            exit 1
          fi
          echo "::notice::publishing @qnulabs/qshield-sdk@${manifest_version}"

      # registry-url points npm at the public registry. NODE_AUTH_TOKEN is
      # deliberately NOT set anywhere in this job: its absence is what makes the
      # npm CLI reach for the OIDC exchange instead of a stored credential.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships an 11.x npm, but pin
      # it rather than depend on which patch the runner image happens to carry - a
      # too-old npm does not fail loudly, it falls back to looking for a token that
      # is not there.
      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Re-run rather than trust the monorepo's gate. Provenance attests that this
      # artefact was built by this workflow from this commit, so the checks that
      # back that claim have to run here too.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Verify the tarball rather than trusting the `files` restriction. A stray
      # test file, a source map pointing at paths the consumer does not have, or an
      # empty dist would all be permanent once published.
      - name: Verify the packed contents
        run: |
          set -euo pipefail
          npm pack --silent > /dev/null
          tarball="$(ls -1 qnulabs-qshield-sdk-*.tgz)"
          echo "packed: ${tarball}"
          contents="$(tar -tzf "${tarball}" | sort)"
          echo "${contents}"

          # LICENSE is included by npm whatever `files` says, and must be: the
          # package declares Apache-2.0 and a declared licence with no text is what
          # a customer's dependency scanner flags. There is deliberately no README
          # in this directory, so none can reach the tarball.
          unexpected="$(echo "${contents}" | grep -v -E '^package/(package\.json|LICENSE|dist/)' || true)"
          if [ -n "${unexpected}" ]; then
            echo "::error::the tarball carries files that must not be published:"
            echo "${unexpected}"
            exit 1
          fi

          maps="$(echo "${contents}" | grep -E '\.map$' || true)"
          if [ -n "${maps}" ]; then
            echo "::error::the tarball carries source maps, which point at paths the consumer does not have:"
            echo "${maps}"
            exit 1
          fi

          # Fail loudly on an empty or half-built package rather than publishing
          # one. Both halves of the dual build must be present.
          for required in \
            package/LICENSE \
            package/dist/esm/index.js \
            package/dist/esm/index.d.ts \
            package/dist/esm/package.json \
            package/dist/cjs/index.js \
            package/dist/cjs/index.d.ts \
            package/dist/cjs/package.json
          do
            if ! echo "${contents}" | grep -qx "${required}"; then
              echo "::error::the tarball is missing ${required}"; exit 1
            fi
          done

          rm -f "${tarball}"

      # No NODE_AUTH_TOKEN, by design. npm exchanges the GitHub OIDC token for a
      # short-lived publish credential. --provenance is explicit rather than left
      # to publishConfig so a manifest edit cannot silently drop the attestation.
      - name: Publish
        run: npm publish --access public --provenance
